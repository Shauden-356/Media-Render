# Builds the Imadia installers for Windows and macOS and attaches them to a GitHub Release.
# Start it by pushing a version tag:   git tag v7.1.0 && git push origin v7.1.0
#
# Signing (so macOS and Windows open the app without warnings) switches on by itself once the
# secrets below exist; until then the builds are ad-hoc signed, as before. See README › Code signing.
#   Mac (Apple Developer ID + notarization), repository secrets:
#     MAC_CERTIFICATE (base64 of the Developer ID Application .p12), MAC_CERTIFICATE_PASSWORD,
#     APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows (Azure Trusted Signing): repository variable WINDOWS_SIGNING = true, secrets
#     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, and variables AZURE_ENDPOINT,
#     AZURE_SIGNING_ACCOUNT, AZURE_CERTIFICATE_PROFILE, AZURE_PUBLISHER_NAME
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only what attaching files to a release needs. Third-party actions are pinned to exact commits,
# so a moved tag can't slip new code into the release builds.
permissions:
  contents: write

jobs:
  build:
    # Builds both Mac versions, and the Windows installer too unless it is signed on Windows below.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Mac apps
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/fetch-binaries.mjs darwin arm64
          node scripts/fetch-binaries.mjs darwin x64
          if [ -n "$CSC_LINK" ]; then
            # Developer ID signature with the hardened runtime, then Apple notarization (the app
            # opens without the "can't check for malicious software" warning).
            npx electron-builder --mac --arm64 --x64 --publish never -c.mac.hardenedRuntime=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --arm64 --x64 --publish never -c.mac.identity=-
          fi

      - name: Build Windows installer (unsigned)
        if: ${{ vars.WINDOWS_SIGNING != 'true' }}
        run: npm run dist:win -- --publish never

      # Copies installed before the rename (Media Zipper 6.x) update themselves from a file named
      # Media-Zipper-mac-<arch>.zip holding "Media Zipper.app". Same app, old names, so they still update.
      - name: Update files for Media Zipper 6.x
        run: |
          for arch in arm64 x64; do
            tmp=$(mktemp -d)
            ditto -x -k "dist/Imadia-mac-$arch.zip" "$tmp"
            mv "$tmp/Imadia.app" "$tmp/Media Zipper.app"
            ditto -c -k --sequesterRsrc --keepParent "$tmp/Media Zipper.app" "dist/Media-Zipper-mac-$arch.zip"
            rm -rf "$tmp"
          done

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Installers, plus what the apps' automatic updates read: latest*.yml (version and
          # checksums), the Mac .zip builds, and blockmaps (Windows downloads only what changed).
          files: |
            dist/Imadia-mac-arm64.dmg
            dist/Imadia-mac-x64.dmg
            dist/Imadia-win-x64.exe
            dist/Imadia-mac-arm64.zip
            dist/Imadia-mac-x64.zip
            dist/Media-Zipper-mac-arm64.zip
            dist/Media-Zipper-mac-x64.zip
            dist/*.blockmap
            dist/latest.yml
            dist/latest-mac.yml
          generate_release_notes: true

      - name: Keep the files (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers
          path: |
            dist/*.dmg
            dist/*.exe

  windows:
    # Signed Windows installer. Azure Trusted Signing runs only on Windows, so this builds there.
    if: ${{ vars.WINDOWS_SIGNING == 'true' }}
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and sign the Windows installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        shell: bash
        run: |
          node scripts/fetch-binaries.mjs win32 x64
          npx electron-builder --win --x64 --publish never \
            "-c.win.azureSignOptions.endpoint=$AZURE_ENDPOINT" \
            "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT" \
            "-c.win.azureSignOptions.certificateProfileName=$AZURE_CERTIFICATE_PROFILE" \
            "-c.win.azureSignOptions.publisherName=$AZURE_PUBLISHER_NAME"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/Imadia-win-x64.exe
            dist/Imadia-win-x64.exe.blockmap
            dist/latest.yml

  android:
    # The Android app. Android only installs updates signed with the same key as the installed app,
    # so it is signed with the project's key from the secrets (README › Android app); without
    # them it is skipped rather than published with a throwaway key.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build and sign the APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Android app skipped: add the ANDROID_KEYSTORE_* secrets (README › Android app)."
            exit 0
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/imadia-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          cd android
          ./gradlew assembleRelease --no-daemon --console=plain
          rm -f "$ANDROID_KEYSTORE_PATH"
          out=app/build/outputs/apk/release
          mkdir -p ../dist
          cp "$out/app-universal-release.apk" ../dist/Imadia-android.apk
          cp "$out/app-arm64-v8a-release.apk" ../dist/Imadia-android-arm64.apk
          cp "$out/app-armeabi-v7a-release.apk" ../dist/Imadia-android-arm32.apk
          cp "$out/app-x86_64-release.apk" ../dist/Imadia-android-x86_64.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/Imadia-android.apk
            dist/Imadia-android-arm64.apk
            dist/Imadia-android-arm32.apk
            dist/Imadia-android-x86_64.apk
