# Builds the Windows and macOS installers and attaches them to a GitHub Release.
# Start it by pushing a version tag:   git tag v6.0.0 && git push origin v6.0.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only what attaching files to a release needs. Third-party actions are pinned to exact commits,
# so a moved tag can't slip new code into the release builds.
permissions:
  contents: write

jobs:
  build:
    # One Mac builds everything: both Mac versions and the Windows installer.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers
        run: |
          npm run dist:mac -- --publish never
          npm run dist:win -- --publish never

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Installers, plus what the apps' automatic updates read: latest*.yml (version and
          # checksums), the Mac .zip builds, and blockmaps (Windows downloads only what changed).
          files: |
            dist/Media-Zipper-mac-arm64.dmg
            dist/Media-Zipper-mac-x64.dmg
            dist/Media-Zipper-win-x64.exe
            dist/Media-Zipper-mac-arm64.zip
            dist/Media-Zipper-mac-x64.zip
            dist/*.blockmap
            dist/latest.yml
            dist/latest-mac.yml
          generate_release_notes: true

      - name: Keep the files (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: |
            dist/*.dmg
            dist/*.exe
