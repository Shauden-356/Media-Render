# Builds the Windows and macOS installers and attaches them to a GitHub Release.
# Start it by pushing a version tag:   git tag v6.0.0 && git push origin v6.0.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # One Mac builds everything: both Mac versions and the Windows installer.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers
        run: |
          npm run dist:mac -- --publish never
          npm run dist:win -- --publish never

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Media-Zipper-mac-arm64.dmg
            dist/Media-Zipper-mac-x64.dmg
            dist/Media-Zipper-win-x64.exe
          generate_release_notes: true

      - name: Keep the files (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/*.dmg
            dist/*.exe
